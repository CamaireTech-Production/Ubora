<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fav-icons/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags - Admin Theme (Red) -->
    <meta name="application-name" content="Ubora Admin" id="meta-app-name" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ubora Admin" id="meta-apple-title" />
    <meta name="description" content="Panel d'administration Ubora pour la gestion des utilisateurs et du système" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-config" content="/fav-icons/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#dc2626" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#dc2626" />
    
    <!-- Dynamic PWA Meta Tags based on environment -->
    <script>
      (function() {
        // Detect environment: dev (admindev.ubora-app.com) or prod (admin.ubora-app.com)
        const isDev = window.location.hostname.includes('admindev') || 
                     window.location.hostname.includes('localhost') ||
                     window.location.hostname.includes('127.0.0.1');
        
        const appName = isDev ? 'Ubora Admin Dev' : 'Ubora Admin';
        
        // Update meta tags
        const appNameMeta = document.getElementById('meta-app-name');
        const appleTitleMeta = document.getElementById('meta-apple-title');
        if (appNameMeta) appNameMeta.content = appName;
        if (appleTitleMeta) appleTitleMeta.content = appName;
        
        // Update page title
        const titleEl = document.getElementById('page-title');
        if (titleEl) titleEl.textContent = appName + ' - Panel d\'Administration';
        document.title = appName + ' - Panel d\'Administration';
      })();
    </script>
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/fav-icons/apple-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/fav-icons/apple-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/fav-icons/apple-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/fav-icons/apple-icon-152x152.png" />
    
    <!-- Standard Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/fav-icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/fav-icons/favicon-16x16.png" />
    <link rel="manifest" href="/manifest-admin.json" />
    <link rel="mask-icon" href="/fav-icons/apple-icon.png" color="#dc2626" />
    <link rel="shortcut icon" href="/fav-icons/favicon.ico" />
    
    <!-- Splash Screens for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-startup-image" href="/fav-icons/apple-icon-180x180.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/fav-icons/apple-icon-180x180.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/fav-icons/apple-icon-180x180.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/fav-icons/apple-icon-180x180.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/fav-icons/apple-icon-180x180.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/fav-icons/apple-icon-180x180.png" media="(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/fav-icons/apple-icon-180x180.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" />
    
    <title id="page-title">Ubora Admin - Panel d'Administration</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
