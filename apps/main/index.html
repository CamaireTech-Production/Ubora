<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fav-icons/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Ubora" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ubora" />
    <meta name="description" content="Application de gestion des formulaires pour entreprises multi-agences" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-config" content="/fav-icons/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#3b82f6" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#3b82f6" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/fav-icons/apple-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/fav-icons/apple-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/fav-icons/apple-icon-180x180.png" />
    
    <!-- Standard Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/fav-icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/fav-icons/favicon-16x16.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" href="/fav-icons/favicon.ico" />
    
    <title>Ubora - Gestion des Formulaires avec ARCHA</title>
    
    <!-- SCRIPT INLINE DE DEBUG - S'exécute AVANT tout -->
    <script>
      (function() {
        'use strict';
        
        var logs = [];
        var debugTop, logDiv;
        
        function initDebug() {
          // Attendre que le body existe
          if (!document.body) {
            setTimeout(initDebug, 10);
            return;
          }
          
          // Créer overlay de debug
          debugTop = document.createElement('div');
          debugTop.id = 'debug-top';
          debugTop.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#0f0;color:#000;padding:0.5rem;z-index:999999;font-family:monospace;font-size:12px;font-weight:bold;text-align:center;';
          debugTop.innerHTML = '✅ JS ACTIF | UA: ' + navigator.userAgent.substring(0, 40);
          document.body.appendChild(debugTop);
          
          logDiv = document.createElement('div');
          logDiv.id = 'debug-logs';
          logDiv.style.cssText = 'position:fixed;top:40px;left:0;right:0;bottom:0;background:#000;color:#0f0;padding:1rem;z-index:999998;font-family:monospace;font-size:11px;overflow:auto;';
          document.body.appendChild(logDiv);
          
          // Afficher les logs accumulés
          if (logs.length > 0) {
            updateLogs();
          }
        }
        
        function updateLogs() {
          if (!logDiv) return;
          logDiv.innerHTML = '<h3 style="color:#0f0;margin:0 0 1rem 0;">📋 LOGS DEBUG</h3><button onclick="var el=document.getElementById(\'debug-logs\');el.style.display=el.style.display===\'none\'?\'\':\'none\';" style="position:fixed;top:50px;right:10px;padding:0.25rem 0.5rem;background:#0f0;color:#000;border:none;border-radius:4px;cursor:pointer;z-index:999999;font-size:10px;">Toggle</button>' + logs.map(function(l) { return '<div style="margin:0.25rem 0;padding:0.25rem;background:#111;border-left:3px solid #0f0;">' + l + '</div>'; }).join('');
        }
        
        function log(msg) {
          var time = new Date().toLocaleTimeString();
          var logMsg = '[' + time + '] ' + msg;
          logs.push(logMsg);
          console.log(logMsg);
          if (logDiv) {
            updateLogs();
          }
        }
        
        // Logs initiaux (avant que le body soit prêt)
        logs.push('[INIT] 🚀 Script inline exécuté');
        logs.push('[INIT] 🌐 UA: ' + navigator.userAgent);
        logs.push('[INIT] 📱 Platform: ' + navigator.platform);
        logs.push('[INIT] 🔗 URL: ' + window.location.href);
        
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        if (isIOS) {
          logs.push('[INIT] 🍎 iOS détecté');
        }
        
        // Exposer log globalement pour main.tsx
        window.debugLog = log;
        
        // Surveiller les erreurs de chargement de scripts
        window.addEventListener('error', function(e) {
          log('❌ ERREUR GLOBALE: ' + e.message);
          log('❌ Fichier: ' + (e.filename || 'unknown'));
          log('❌ Ligne: ' + (e.lineno || 'unknown'));
        }, true);
        
        // Démarrer l'initialisation (qui affichera les logs)
        initDebug();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite injectera automatiquement le bon chemin vers main.tsx compilé -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
