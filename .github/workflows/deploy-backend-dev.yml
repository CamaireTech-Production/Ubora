name: Deploy Backend to VPS (Development)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies (root)
      run: npm ci
      
    - name: Create environment file for backend
      run: |
        cat > .env << EOF
        # Development Backend Environment Variables
        
        # Firebase Configuration
        FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
        FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
        
        # OpenAI Configuration
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        
        # Server Configuration
        PORT=3001
        NODE_ENV=development
        
        # CORS Configuration - Match local dev server configuration (including HTTP for dev)
        CORS_ORIGIN=https://dev.ubora-app.com,https://ubora-app.com,https://my.ubora.com,https://dev.ubora.com,https://apidev.ubora-app.com,https://api.ubora-app.com,https://apidev.ubora.com,https://api.ubora.com,https://admin.ubora-app.com,https://admin.ubora.com,https://studio-gpnfx.firebaseapp.com,https://studio-gpnfx.web.app,http://localhost:5173,http://localhost:3000,http://localhost:4173,https://localhost:5173,https://localhost:3000,http://dev.ubora.com,http://my.ubora.com,http://dev.ubora-app.com,http://ubora-app.com,http://apidev.ubora-app.com
        EOF
        
    - name: Create version stamp
      run: echo "${GITHUB_SHA}" > VERSION

    - name: Create deployment tarball
      run: |
        tar --exclude-vcs -czf deploy.tar.gz \
          api \
          server \
          package.json \
          package-lock.json \
          .env \
          VERSION

    - name: Upload artifact to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_PORT }}
        source: "deploy.tar.gz"
        target: "/var/www/ubora-backend-dev/uploads/"

    - name: Deploy on VPS (Enhanced with robust error handling)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          set -e
          
          # Configuration
          BASE_DIR=/var/www/ubora-backend-dev
          RELEASES_DIR=$BASE_DIR/releases
          UPLOADS_DIR=$BASE_DIR/uploads
          TS=$(date +%Y%m%d%H%M%S)
          NEW_RELEASE=$RELEASES_DIR/$TS
          CURRENT_LINK=$BASE_DIR/current
          DOMAIN=apidev.ubora-app.com
          
          # Create directories
          mkdir -p $RELEASES_DIR $UPLOADS_DIR /var/log/pm2
          
          # Extract and setup new release
          echo "📦 Extracting artifact to release $NEW_RELEASE"
          mkdir -p $NEW_RELEASE
          tar -xzf $UPLOADS_DIR/deploy.tar.gz -C $NEW_RELEASE
          
          cd $NEW_RELEASE
          echo "📥 Installing dependencies (root)"
          npm ci --production || npm install --production
          echo "📥 Installing dependencies (api)"
          cd api && npm ci --production || npm install --production; cd ..
          
          # Update symlink
          echo "🔁 Updating current symlink"
          ln -sfn $NEW_RELEASE $CURRENT_LINK
          
          # Enhanced PM2 management
          echo "🛑 Managing PM2 processes"
          pm2 stop ubora-backend-dev || true
          pm2 delete ubora-backend-dev || true
          
          # Start with enhanced configuration (compatible with older PM2 versions)
          pm2 start $CURRENT_LINK/server/production-server.js \
            --name ubora-backend-dev \
            --update-env \
            --max-memory-restart 1G \
            --log /var/log/pm2/ubora-backend-dev-combined.log \
            --error /var/log/pm2/ubora-backend-dev-error.log \
            --out /var/log/pm2/ubora-backend-dev-out.log
          
          pm2 save
          
          # Wait and verify
          echo "⏳ Waiting for app to boot"
          sleep 15
          
          # Enhanced health check with retries
          echo "🧪 Health check with retries"
          HEALTH_OK=false
          for i in {1..5}; do
            if curl -fsS http://localhost:3001/health > /dev/null; then
              echo "✅ Health check passed (attempt $i)"
              HEALTH_OK=true
              break
            else
              echo "⏳ Health check failed (attempt $i), retrying..."
              sleep 5
            fi
          done
          
          if [ "$HEALTH_OK" = false ]; then
            echo "❌ Health check failed after 5 attempts. Rolling back..."
            PREV=$(ls -1dt $RELEASES_DIR/* | sed -n '2p')
            if [ -n "$PREV" ]; then
              ln -sfn $PREV $CURRENT_LINK
              pm2 stop ubora-backend-dev || true
              pm2 delete ubora-backend-dev || true
              pm2 start $CURRENT_LINK/server/production-server.js \
                --name ubora-backend-dev \
                --update-env \
                --max-memory-restart 1G
              pm2 save
              sleep 10
              curl -fsS http://localhost:3001/health || true
            fi
            exit 1
          fi
          
          # Cleanup old releases
          echo "🧹 Cleaning old releases (keep 5)"
          ls -1dt $RELEASES_DIR/* | tail -n +6 | xargs -r rm -rf

          # Enhanced SSL and Nginx setup
          echo "🔧 Setting up enhanced SSL and Nginx configuration"
          
          # Clean up conflicting configurations
          rm -f /etc/nginx/sites-enabled/default
          rm -f /etc/nginx/sites-enabled/api-dev.ubora-app.com
          
          # Create HTTP-only configuration first
          echo "🔧 Creating HTTP-only Nginx configuration for $DOMAIN"
          cat > /etc/nginx/sites-available/$DOMAIN << 'EOF'
          server {
              listen 80;
              server_name apidev.ubora-app.com;
              
              client_max_body_size 100M;
              proxy_connect_timeout 300s;
              proxy_send_timeout 300s;
              proxy_read_timeout 300s;
              send_timeout 300s;
              
              location / {
                  proxy_pass http://localhost:3001;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }
              
              # Health check endpoint
              location /health {
                  proxy_pass http://localhost:3001/health;
                  access_log off;
              }
          }
          EOF
          
          # Enable site
          ln -sf /etc/nginx/sites-available/$DOMAIN /etc/nginx/sites-enabled/
          
          # Test nginx configuration
          nginx -t || {
            echo "❌ Nginx configuration test failed"
            exit 1
          }
          
          # Reload nginx
          systemctl reload nginx
          
          # Wait for DNS propagation
          echo "⏳ Waiting for DNS propagation"
          sleep 30
          
          # Verify domain resolution
          if ! nslookup $DOMAIN > /dev/null 2>&1; then
            echo "⚠️ Domain resolution failed, skipping SSL setup"
            exit 0
          fi
          
          # Install/update SSL certificate
          echo "🔐 Setting up SSL certificate"
          if ! command -v certbot >/dev/null 2>&1; then
            apt-get update -y
            apt-get install -y certbot python3-certbot-nginx
          fi
          
          # Issue or renew certificate
          certbot --nginx -d $DOMAIN --non-interactive --agree-tos -m admin@ubora-app.com --redirect || {
            echo "⚠️ SSL certificate setup failed, continuing with HTTP-only"
            echo "🔧 Manual SSL setup: certbot --nginx -d $DOMAIN"
          }
          
          # Final verification
          echo "🧪 Final verification"
          nginx -t && systemctl reload nginx
          
          # Test both HTTP and HTTPS
          curl -fsS http://$DOMAIN/health > /dev/null && echo "✅ HTTP working"
          curl -fsS https://$DOMAIN/health > /dev/null && echo "✅ HTTPS working" || echo "⚠️ HTTPS not working"
          
          echo "✅ Development backend deployed successfully"
