name: Deploy Backend to VPS (Development)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies (root)
      run: npm ci
      
    - name: Create environment file for backend
      run: |
        # Create .env.local with Firebase private key handled separately to avoid quote issues
        cat > .env.local << EOF
        # Development Backend Environment Variables
        
        # Firebase Configuration
        FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
        EOF
        # Append private key - simpler approach that preserves format better
        # Convert actual newlines to literal \n but don't over-escape
        printf 'FIREBASE_PRIVATE_KEY="' >> .env.local
        # Only escape quotes and convert newlines - don't escape backslashes (to avoid double-escaping)
        printf '%s' "${{ secrets.FIREBASE_PRIVATE_KEY }}" | sed -z 's/"/\\"/g; s/\n/\\n/g' >> .env.local
        printf '"\n' >> .env.local
        cat >> .env.local << EOF
        
        # OpenAI Configuration
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        
        # Email Configuration
        EMAIL_USER=${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
        EMAIL_HOST=${{ secrets.EMAIL_HOST }}
        EMAIL_FROM=${{ secrets.EMAIL_FROM }}
        EMAIL_FROM_NAME=${{ secrets.EMAIL_FROM_NAME }}
        
        # Server Configuration
        PORT=3001
        NODE_ENV=development
        
        # CORS Configuration - Match local dev server configuration (including HTTP for dev and pre-release)
        CORS_ORIGIN=https://dev.ubora-app.com,https://ubora-app.com,https://my.ubora.com,https://dev.ubora.com,https://pre.ubora-app.com,https://apidev.ubora-app.com,https://api.ubora-app.com,https://apirelease.ubora-app.com,https://apidev.ubora.com,https://api.ubora.com,https://admin.ubora-app.com,https://admin.ubora.com,https://adminpre.ubora-app.com,https://admindev.ubora-app.com,https://studio-gpnfx.firebaseapp.com,https://studio-gpnfx.web.app,http://localhost:5173,http://localhost:3000,http://localhost:4173,https://localhost:5173,https://localhost:3000,http://dev.ubora.com,http://my.ubora.com,http://dev.ubora-app.com,http://ubora-app.com,http://apidev.ubora-app.com
        
        # Vector Database (Qdrant) Configuration
        QDRANT_URL=${{ secrets.QDRANT_URL }}
        QDRANT_COLLECTION_NAME=ubora_vectors
        EMBEDDING_MODEL=text-embedding-3-small
        EOF
        
    - name: Verify environment file format
      run: |
        echo "🔍 Verifying .env.local format..."
        if grep -q '^FIREBASE_PRIVATE_KEY=""' .env.local; then
          echo "❌ ERROR: Double quotes detected in FIREBASE_PRIVATE_KEY!"
          exit 1
        fi
        if grep -c '^FIREBASE_PRIVATE_KEY=' .env.local | grep -vq '^1$'; then
          echo "❌ ERROR: FIREBASE_PRIVATE_KEY appears multiple times or is split across lines!"
          grep '^FIREBASE_PRIVATE_KEY=' .env.local | head -c 200
          exit 1
        fi
        if ! grep -q '^FIREBASE_PRIVATE_KEY="-----BEGIN PRIVATE KEY-----' .env.local; then
          echo "⚠️  WARNING: FIREBASE_PRIVATE_KEY format might be incorrect"
          grep '^FIREBASE_PRIVATE_KEY=' .env.local | head -c 150
        else
          echo "✅ FIREBASE_PRIVATE_KEY format looks correct (single line with quotes)"
        fi
        
    - name: Create version stamp
      run: echo "${GITHUB_SHA}" > VERSION

    - name: Create deployment tarball
      run: |
        tar --exclude-vcs -czf deploy.tar.gz \
          api \
          server \
          scripts \
          package.json \
          package-lock.json \
          ecosystem.config.js \
          .env.local \
          VERSION

    - name: Upload artifact to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_PORT }}
        source: "deploy.tar.gz"
        target: "/var/www/ubora-backend-dev/uploads/"

    - name: Deploy on VPS (Enhanced with robust error handling)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_PORT }}
        command_timeout: 20m
        script: |
          set -e
          
          # Configuration
          BASE_DIR=/var/www/ubora-backend-dev
          RELEASES_DIR=$BASE_DIR/releases
          UPLOADS_DIR=$BASE_DIR/uploads
          TS=$(date +%Y%m%d%H%M%S)
          NEW_RELEASE=$RELEASES_DIR/$TS
          CURRENT_LINK=$BASE_DIR/current
          DOMAIN=apidev.ubora-app.com
          
          # Create directories
          mkdir -p $RELEASES_DIR $UPLOADS_DIR /var/log/pm2
          
          # Extract and setup new release
          echo "📦 Extracting artifact to release $NEW_RELEASE"
          mkdir -p $NEW_RELEASE
          tar -xzf $UPLOADS_DIR/deploy.tar.gz -C $NEW_RELEASE
          
          # Verify critical exports exist in deployed code
          echo "🔍 Verifying critical exports in deployed code"
          if [ -f "$NEW_RELEASE/api/ai/tokenManager.js" ]; then
            if grep -q "export function calculateUserTokens" "$NEW_RELEASE/api/ai/tokenManager.js"; then
              echo "✅ calculateUserTokens export found in tokenManager.js"
            else
              echo "❌ ERROR: calculateUserTokens export NOT found in tokenManager.js"
              echo "📋 File content (first 30 lines):"
              head -n 30 "$NEW_RELEASE/api/ai/tokenManager.js" || true
              exit 1
            fi
          else
            echo "❌ ERROR: tokenManager.js file not found in deployment"
            exit 1
          fi
          
          cd $NEW_RELEASE
          echo "📥 Installing dependencies (root)"
          npm ci --production || npm install --production
          echo "📥 Installing dependencies (api)"
          cd api && npm ci --production || npm install --production; cd ..
          
          # Verify .env.local exists and PORT is set
          echo "🔍 Verifying environment configuration"
          if [ -f "$NEW_RELEASE/.env.local" ]; then
            echo "✅ .env.local file found"
            if grep -q "^PORT=" "$NEW_RELEASE/.env.local"; then
              ENV_PORT=$(grep "^PORT=" "$NEW_RELEASE/.env.local" | cut -d'=' -f2)
              echo "✅ PORT found in .env.local: $ENV_PORT"
            else
              echo "⚠️ PORT not found in .env.local, will use explicit PORT=3001"
            fi
          else
            echo "⚠️ .env.local file not found, will use explicit PORT=3001"
          fi
          
          # Update symlink (force update to ensure it's correct)
          echo "🔁 Updating current symlink"
          rm -f $CURRENT_LINK
          ln -sfn $NEW_RELEASE $CURRENT_LINK
          
          # Verify symlink immediately
          SYMLINK_CHECK=$(readlink -f $CURRENT_LINK 2>/dev/null || readlink $CURRENT_LINK 2>/dev/null || echo "")
          if [ "$SYMLINK_CHECK" != "$NEW_RELEASE" ]; then
            echo "❌ CRITICAL: Symlink verification failed!"
            echo "   Expected: $NEW_RELEASE"
            echo "   Got: $SYMLINK_CHECK"
            exit 1
          fi
          echo "✅ Symlink verified: $CURRENT_LINK -> $NEW_RELEASE"
          
          # Enhanced PM2 management with cron worker
          echo "🛑 Managing PM2 processes (dev only)"
          pm2 stop ubora-backend-dev || true
          pm2 stop ubora-cron-worker-dev || true
          pm2 delete ubora-backend-dev || true
          pm2 delete ubora-cron-worker-dev || true
          
          # Verify symlink points to correct release
          echo "🔍 Verifying symlink"
          SYMLINK_TARGET=$(readlink -f $CURRENT_LINK)
          if [ "$SYMLINK_TARGET" != "$NEW_RELEASE" ]; then
            echo "⚠️ Symlink mismatch! Expected: $NEW_RELEASE, Got: $SYMLINK_TARGET"
            echo "🔧 Fixing symlink..."
            ln -sfn $NEW_RELEASE $CURRENT_LINK
            SYMLINK_TARGET=$(readlink -f $CURRENT_LINK)
            echo "✅ Symlink now points to: $SYMLINK_TARGET"
          else
            echo "✅ Symlink correctly points to: $SYMLINK_TARGET"
          fi
          
          # Verify the file exists and has the export before starting
          echo "🔍 Verifying export in current release"
          if [ ! -f "$CURRENT_LINK/api/ai/tokenManager.js" ]; then
            echo "❌ CRITICAL: tokenManager.js not found in $CURRENT_LINK"
            exit 1
          fi
          if ! grep -q "export function calculateUserTokens" "$CURRENT_LINK/api/ai/tokenManager.js"; then
            echo "❌ CRITICAL: calculateUserTokens export missing in current release"
            echo "📋 File content (lines 20-30):"
            sed -n '20,30p' "$CURRENT_LINK/api/ai/tokenManager.js" || true
            exit 1
          fi
          echo "✅ Export verified in current release"
          
          # Start backend server with explicit PORT=3001 and absolute path
          echo "🚀 Starting backend server with PORT=3001"
          export PORT=3001
          export NODE_ENV=development
          
          # Use absolute path to ensure correct working directory
          ABSOLUTE_SERVER_PATH="$CURRENT_LINK/server/dev-server.js"
          if [ ! -f "$ABSOLUTE_SERVER_PATH" ]; then
            echo "❌ CRITICAL: dev-server.js not found at $ABSOLUTE_SERVER_PATH"
            exit 1
          fi
          
          # Change to the release directory to ensure correct module resolution
          cd "$CURRENT_LINK"
          echo "📁 Working directory: $(pwd)"
          echo "📁 Server path: $ABSOLUTE_SERVER_PATH"
          
          # Clear any Node.js module cache by touching the file
          touch "$CURRENT_LINK/api/ai/tokenManager.js"
          touch "$CURRENT_LINK/api/ai/openAIClient.js"
          
          pm2 start "$ABSOLUTE_SERVER_PATH" \
            --name ubora-backend-dev \
            --update-env \
            --max-memory-restart 1G \
            --env development \
            --cwd "$CURRENT_LINK"
          cd -
          
          # Wait a moment and verify the process started correctly
          sleep 3
          if pm2 describe ubora-backend-dev > /dev/null 2>&1; then
            echo "✅ PM2 process started successfully"
            # Check if there are immediate errors
            ERROR_COUNT=$(pm2 logs ubora-backend-dev --err --lines 5 --nostream 2>&1 | grep -c "calculateUserTokens" || echo "0")
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "⚠️ Warning: Found calculateUserTokens errors in logs immediately after start"
              pm2 logs ubora-backend-dev --err --lines 10 --nostream || true
            fi
          else
            echo "❌ PM2 process failed to start"
            exit 1
          fi
            
          # Start cron worker (if file exists)
          if [ -f "$CURRENT_LINK/scripts/cron-worker.js" ]; then
            pm2 start $CURRENT_LINK/scripts/cron-worker.js \
              --name ubora-cron-worker-dev \
              --update-env \
              --max-memory-restart 512M \
              --env development
          else
            echo "⚠️ Warning: cron-worker.js not found, skipping cron worker startup"
          fi
          
          pm2 save
          
          # Wait and verify
          echo "⏳ Waiting for processes to boot"
          sleep 15
          
          # Check PM2 processes
          echo "📊 Checking PM2 processes"
          pm2 status
          
          # Check if backend process is still running
          if ! pm2 describe ubora-backend-dev > /dev/null 2>&1; then
            echo "❌ Backend process not found in PM2"
            echo "📋 Checking backend error logs"
            pm2 logs ubora-backend-dev --err --lines 50 --nostream || true
            exit 1
          fi
          
          # Check backend process status
          BACKEND_STATUS=$(pm2 describe ubora-backend-dev 2>/dev/null | grep -i "status" | head -1 | awk '{print $NF}' || echo "unknown")
          if [ "$BACKEND_STATUS" != "online" ] && [ "$BACKEND_STATUS" != "errored" ]; then
            echo "❌ Backend process status: $BACKEND_STATUS (expected: online)"
            echo "📋 Checking backend error logs"
            pm2 logs ubora-backend-dev --err --lines 50 --nostream || true
            echo "📋 Checking backend output logs"
            pm2 logs ubora-backend-dev --out --lines 50 --nostream || true
            # If status is errored, still try to continue as it might recover
            if [ "$BACKEND_STATUS" = "errored" ]; then
              echo "⚠️ Backend process is in errored state, but continuing health check..."
            else
              exit 1
            fi
          fi
          
          # Check backend error logs for startup issues
          echo "📋 Checking backend error logs for startup issues"
          ERROR_LOG=$(pm2 logs ubora-backend-dev --err --lines 20 --nostream 2>&1 || true)
          if echo "$ERROR_LOG" | grep -qi "error\|failed\|exit"; then
            echo "⚠️ Errors found in backend logs:"
            echo "$ERROR_LOG"
          else
            echo "✅ No critical errors in backend logs"
          fi
          
          # Check what port the server is actually listening on
          echo "🔍 Checking which ports are in use"
          netstat -tlnp 2>/dev/null | grep -E ":(3000|3001)" || ss -tlnp 2>/dev/null | grep -E ":(3000|3001)" || echo "⚠️ Could not check listening ports"
          
          # Enhanced health check with retries
          echo "🧪 Health check with retries"
          HEALTH_OK=false
          for i in {1..5}; do
            if curl -fsS http://localhost:3001/api/test > /dev/null; then
              echo "✅ Backend health check passed (attempt $i)"
              HEALTH_OK=true
              break
            else
              echo "⏳ Backend health check failed (attempt $i), retrying..."
              # Check if process is still running
              if ! pm2 describe ubora-backend-dev > /dev/null 2>&1; then
                echo "❌ Backend process crashed during health check"
                pm2 logs ubora-backend-dev --err --lines 30 --nostream || true
                break
              fi
              sleep 5
            fi
          done
          
          # Check cron worker logs (if process exists)
          if pm2 describe ubora-cron-worker-dev > /dev/null 2>&1; then
            echo "📋 Checking cron worker logs (last 10 lines)"
            LOG_FILE="$HOME/.pm2/logs/ubora-cron-worker-dev-out.log"
            if [ -f "$LOG_FILE" ]; then
              tail -n 10 "$LOG_FILE" || true
            else
              echo "⚠️ Log file not found yet"
            fi
          else
            echo "⚠️ Cron worker not running (file may not exist)"
          fi
          
          if [ "$HEALTH_OK" = false ]; then
            echo "❌ Health check failed after 5 attempts. Diagnosing issue..."
            
            # Comprehensive diagnostics
            echo "📋 Full backend error logs:"
            pm2 logs ubora-backend-dev --err --lines 100 --nostream || true
            echo ""
            echo "📋 Full backend output logs:"
            pm2 logs ubora-backend-dev --out --lines 100 --nostream || true
            echo ""
            echo "📊 PM2 process details:"
            pm2 describe ubora-backend-dev || true
            echo ""
            echo "🔍 Network connections:"
            netstat -tlnp 2>/dev/null | grep -E ":(3000|3001)" || ss -tlnp 2>/dev/null | grep -E ":(3000|3001)" || true
            
            echo "🔄 Rolling back to previous release..."
            PREV=$(ls -1dt $RELEASES_DIR/* | sed -n '2p')
            if [ -n "$PREV" ]; then
              ln -sfn $PREV $CURRENT_LINK
              pm2 stop ubora-backend-dev || true
              pm2 stop ubora-cron-worker-dev || true
              pm2 delete ubora-backend-dev || true
              pm2 delete ubora-cron-worker-dev || true
              echo "🚀 Starting previous release with PORT=3001"
              export PORT=3001
              export NODE_ENV=development
              cd $CURRENT_LINK
              pm2 start server/dev-server.js \
                --name ubora-backend-dev \
                --update-env \
                --max-memory-restart 1G \
                --env development
              cd -
              if [ -f "$CURRENT_LINK/scripts/cron-worker.js" ]; then
                pm2 start $CURRENT_LINK/scripts/cron-worker.js \
                  --name ubora-cron-worker-dev \
                  --update-env \
                  --max-memory-restart 512M \
                  --env development
              fi
              pm2 save
              sleep 10
              curl -fsS http://localhost:3001/health || true
            fi
            exit 1
          fi
          
          # Cleanup old releases
          echo "🧹 Cleaning old releases (keep 5)"
          ls -1dt $RELEASES_DIR/* | tail -n +6 | xargs -r rm -rf

          # Enhanced SSL and Nginx setup
          echo "🔧 Setting up enhanced SSL and Nginx configuration"
          
          # Clean up conflicting configurations
          rm -f /etc/nginx/sites-enabled/default
          rm -f /etc/nginx/sites-enabled/api-dev.ubora-app.com
          
          # Create HTTP-only configuration first
          echo "🔧 Creating HTTP-only Nginx configuration for $DOMAIN"
          cat > /etc/nginx/sites-available/$DOMAIN << 'EOF'
          server {
              listen 80;
              server_name apidev.ubora-app.com;
              
              client_max_body_size 100M;
              proxy_connect_timeout 300s;
              proxy_send_timeout 300s;
              proxy_read_timeout 300s;
              send_timeout 300s;
              
              location / {
                  proxy_pass http://localhost:3001;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }
              
              # Health check endpoint
              location /health {
                  proxy_pass http://localhost:3001/health;
                  access_log off;
              }
          }
          EOF
          
          # Enable site
          ln -sf /etc/nginx/sites-available/$DOMAIN /etc/nginx/sites-enabled/
          
          # Test nginx configuration
          nginx -t || {
            echo "❌ Nginx configuration test failed"
            exit 1
          }
          
          # Reload nginx
          systemctl reload nginx
          
          # SSL setup (non-blocking with timeouts)
          echo "🔧 Setting up SSL (non-blocking)"
          set +e  # Allow SSL setup to fail without stopping deployment
          
          # Wait for DNS propagation (quick check)
          echo "⏳ Checking domain resolution"
          if timeout 10 nslookup $DOMAIN > /dev/null 2>&1; then
            echo "✅ Domain resolves correctly"
            
            # Install certbot if needed (with timeout)
            if ! command -v certbot >/dev/null 2>&1; then
              echo "📦 Installing certbot (max 2 minutes)..."
              timeout 120 bash -c 'apt-get update -y && apt-get install -y certbot python3-certbot-nginx' || {
                echo "⚠️ Certbot installation timeout or failed, skipping SSL setup"
                set -e
                echo "✅ Development backend deployed successfully (without SSL)"
                exit 0
              }
            fi
            
            # Issue or renew certificate with timeout (max 5 minutes)
            if command -v certbot >/dev/null 2>&1; then
              echo "🔐 Attempting SSL certificate setup (max 5 minutes)..."
              timeout 300 certbot --nginx -d $DOMAIN --non-interactive --agree-tos -m admin@ubora-app.com --redirect --no-eff-email || {
                echo "⚠️ SSL certificate setup failed or timed out, continuing with HTTP-only"
                echo "🔧 Manual SSL setup: certbot --nginx -d $DOMAIN"
              }
            fi
          else
            echo "⚠️ Domain resolution failed or timed out, skipping SSL setup"
          fi
          
          set -e  # Re-enable exit on error for final verification
          
          # Final verification
          echo "🧪 Final verification"
          nginx -t && systemctl reload nginx
          
          # Test HTTP (HTTPS is optional)
          curl -fsS --max-time 5 http://$DOMAIN/health > /dev/null && echo "✅ HTTP working" || echo "⚠️ HTTP health check failed"
          curl -fsS --max-time 5 https://$DOMAIN/health > /dev/null && echo "✅ HTTPS working" || echo "⚠️ HTTPS not working (non-critical)"
          
          echo "✅ Development backend deployed successfully"
