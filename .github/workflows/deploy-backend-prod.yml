name: Deploy Backend to VPS (Production)

on:
  push:
    branches: [ master ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies (root)
      run: npm ci

    - name: Create environment file for backend
      run: |
        cat > .env << EOF
        # Production Backend Environment Variables
        
        # Firebase Configuration
        FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
        FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
        
        # OpenAI Configuration
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        
        # Server Configuration
        PORT=3000
        NODE_ENV=production
        
        # CORS Configuration - Match production server configuration
        CORS_ORIGIN=https://dev.ubora-app.com,https://ubora-app.com,https://my.ubora.com,https://dev.ubora.com,https://apidev.ubora-app.com,https://api.ubora-app.com,https://apidev.ubora.com,https://api.ubora.com,https://admin.ubora-app.com,https://admin.ubora.com,https://studio-gpnfx.firebaseapp.com,https://studio-gpnfx.web.app,http://localhost:5173,http://localhost:3000,http://localhost:4173,https://localhost:5173,https://localhost:3000
        EOF

    - name: Create version stamp
      run: echo "${GITHUB_SHA}" > VERSION

    - name: Create deployment tarball
      run: |
        tar --exclude-vcs -czf deploy.tar.gz \
          api \
          server \
          package.json \
          package-lock.json \
          .env \
          VERSION

    - name: Upload artifact to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        source: "deploy.tar.gz"
        target: "/var/www/ubora-backend-prod/uploads/"

    - name: Deploy on VPS (releases + symlink + PM2 + health)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          set -e
          BASE_DIR=/var/www/ubora-backend-prod
          RELEASES_DIR=$BASE_DIR/releases
          UPLOADS_DIR=$BASE_DIR/uploads
          TS=$(date +%Y%m%d%H%M%S)
          NEW_RELEASE=$RELEASES_DIR/$TS
          CURRENT_LINK=$BASE_DIR/current

          mkdir -p $RELEASES_DIR $UPLOADS_DIR
          echo "📦 Extracting artifact to release $NEW_RELEASE"
          mkdir -p $NEW_RELEASE
          tar -xzf $UPLOADS_DIR/deploy.tar.gz -C $NEW_RELEASE

          cd $NEW_RELEASE
          echo "📥 Installing dependencies (root)"
          npm ci || npm install
          echo "📥 Installing dependencies (api)"
          cd api && npm ci || npm install; cd ..

          echo "🔁 Updating current symlink"
          ln -sfn $NEW_RELEASE $CURRENT_LINK

          echo "🛑 Restarting PM2"
          pm2 stop ubora-backend-prod || true
          pm2 delete ubora-backend-prod || true
          pm2 flush || true
          pm2 kill || true
          sleep 2

          echo "🚀 Starting app with PM2"
          pm2 start $CURRENT_LINK/server/production-server.js --name ubora-backend-prod --update-env
          pm2 save

          echo "⏳ Waiting for app to boot"
          sleep 10
          echo "📊 PM2 Status:"
          pm2 list

          echo "🧪 Health check"
          if curl -fsS http://localhost:3000/health > /dev/null; then
            echo "✅ Health OK"
          else
            echo "❌ Health check failed. Rolling back..."
            PREV=$(ls -1dt $RELEASES_DIR/* | sed -n '2p')
            if [ -n "$PREV" ]; then
              ln -sfn $PREV $CURRENT_LINK
              pm2 stop ubora-backend-prod || true
              pm2 delete ubora-backend-prod || true
              pm2 start $CURRENT_LINK/server/production-server.js --name ubora-backend-prod --update-env
              pm2 save
              sleep 8
              curl -fsS http://localhost:3000/health || true
            fi
            exit 1
          fi

          echo "🧹 Cleaning old releases (keep 5)"
          ls -1dt $RELEASES_DIR/* | tail -n +6 | xargs -r rm -rf

          # Clean up conflicting Nginx configurations BEFORE creating new ones
          echo "🧹 Cleaning up conflicting Nginx configurations..."
          
          # Remove conflicting default site if it contains api.ubora-app.com
          if grep -q "api.ubora-app.com" /etc/nginx/sites-available/default; then
            echo "⚠️ Removing api.ubora-app.com from default site"
            sed -i '/api.ubora-app.com/d' /etc/nginx/sites-available/default
            sed -i '/ssl_certificate.*api.ubora-app.com/d' /etc/nginx/sites-available/default
            sed -i '/ssl_certificate_key.*api.ubora-app.com/d' /etc/nginx/sites-available/default
          fi
          
          # Remove any conflicting apidev configurations from production deployment
          if [ -f /etc/nginx/sites-available/api-dev.ubora-app.com ]; then
            echo "⚠️ Removing conflicting api-dev.ubora-app.com configuration"
            rm -f /etc/nginx/sites-enabled/api-dev.ubora-app.com
            rm -f /etc/nginx/sites-available/api-dev.ubora-app.com
          fi
          
          # Disable default site to prevent conflicts
          rm -f /etc/nginx/sites-enabled/default
          
          # Create Nginx configuration for api.ubora-app.com
          echo "🔧 Creating Nginx configuration for api.ubora-app.com..."
          cat > /etc/nginx/sites-available/api.ubora-app.com << 'EOF'
          server {
              listen 80;
              listen 443 ssl;
              server_name api.ubora-app.com;
              
              ssl_certificate /etc/letsencrypt/live/api.ubora-app.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/api.ubora-app.com/privkey.pem;
              
              # Increase timeouts and body size for PDF processing
              client_max_body_size 100M;
              proxy_connect_timeout 300s;
              proxy_send_timeout 300s;
              proxy_read_timeout 300s;
              send_timeout 300s;
              
              location / {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
                  
                  # Additional timeout settings for this location
                  proxy_connect_timeout 300s;
                  proxy_send_timeout 300s;
                  proxy_read_timeout 300s;
              }
          }
          EOF
          
          # Enable ONLY the api.ubora-app.com site
          echo "🔗 Enabling api.ubora-app.com site..."
          ln -sf /etc/nginx/sites-available/api.ubora-app.com /etc/nginx/sites-enabled/
          
          # Ensure apidev.ubora-app.com is also enabled (for development)
          if [ -f /etc/nginx/sites-available/apidev.ubora-app.com ]; then
            echo "🔗 Ensuring apidev.ubora-app.com is enabled..."
            ln -sf /etc/nginx/sites-available/apidev.ubora-app.com /etc/nginx/sites-enabled/
          fi
          
          echo "🔐 Ensuring Certbot is installed"
          if ! command -v certbot >/dev/null 2>&1; then
            apt-get update -y
            apt-get install -y certbot python3-certbot-nginx
          fi
          
          echo "🔐 Configure SSL certificate for api.ubora-app.com"
          DOMAIN=api.ubora-app.com
          if ! grep -q "listen 80" /etc/nginx/sites-available/$DOMAIN; then
            echo "❌ $DOMAIN config missing listen 80; please ensure port 80 is present."
            exit 1
          fi
          if [ ! -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
            echo "🔐 Issuing certificate for $DOMAIN"
            certbot --nginx -d $DOMAIN --non-interactive --agree-tos -m admin@$DOMAIN || true
          else
            echo "🔐 Re-deploying existing certificate for $DOMAIN"
            certbot install --nginx -d $DOMAIN || true
          fi
          
          echo "♻️ Attempting safe renew"
          certbot renew --quiet || true
          
          # Test and reload Nginx
          echo "🧪 Testing Nginx configuration..."
          nginx -t && systemctl reload nginx
          
          # Verify no conflicts
          echo "✅ Verifying no server name conflicts..."
          nginx -T 2>/dev/null | grep -c "server_name api.ubora-app.com" || echo "No conflicts found"
          
          echo "✅ Production backend deployed successfully"
