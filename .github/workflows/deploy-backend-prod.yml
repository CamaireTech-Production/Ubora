name: Deploy Backend to VPS (Production)

on:
  push:
    branches: [ master ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Create environment file for backend
      run: |
        cat > .env << EOF
        # Production Backend Environment Variables
        
        # Firebase Configuration
        FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
        FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
        
        # OpenAI Configuration
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        
        # Server Configuration
        PORT=3000
        NODE_ENV=production
        
        # CORS Configuration
        CORS_ORIGIN=https://my.ubora-app.com,https://api.ubora-app.com
        EOF
        
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          # Create directories if they don't exist
          mkdir -p /var/www/ubora-backend-prod
          cd /var/www/ubora-backend-prod
          
          # Clone repository if it doesn't exist
          if [ ! -d ".git" ]; then
            git clone https://github.com/CamaireTech-Production/Ubora.git .
            git checkout master
          else
            git pull origin master
          fi
          
          # Install dependencies from root package.json
          npm install
          
          # Install API dependencies (pdf-parse, etc.)
          cd api && npm install && cd ..
          
          # Create/update .env file
          cat > .env << 'EOF'
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          PORT=3000
          NODE_ENV=production
          CORS_ORIGIN=https://my.ubora-app.com,https://api.ubora-app.com
          EOF
          
          # Stop existing process
          pm2 stop ubora-backend-prod || true
          pm2 delete ubora-backend-prod || true
          
          # Start fresh with PM2
          pm2 start server/production-server.js --name ubora-backend-prod
          pm2 save
          
          # Wait a moment for startup
          sleep 3
          
          # Check if it's running
          pm2 list
          
          # Test the endpoint
          curl -f http://localhost:3000/health || echo "Health check failed"
          
          # Create Nginx configuration for api.ubora-app.com
          cat > /etc/nginx/sites-available/api.ubora-app.com << 'EOF'
          server {
              listen 80;
              listen 443 ssl;
              server_name api.ubora-app.com;
              
              ssl_certificate /etc/letsencrypt/live/api.ubora-app.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/api.ubora-app.com/privkey.pem;
              
              # Increase timeouts for PDF processing
              proxy_connect_timeout 300s;
              proxy_send_timeout 300s;
              proxy_read_timeout 300s;
              send_timeout 300s;
              
              location / {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
                  
                  # Additional timeout settings for this location
                  proxy_connect_timeout 300s;
                  proxy_send_timeout 300s;
                  proxy_read_timeout 300s;
              }
          }
          EOF
          
          # Enable the site
          ln -sf /etc/nginx/sites-available/api.ubora-app.com /etc/nginx/sites-enabled/
          
          # Test and reload Nginx
          nginx -t && systemctl reload nginx
          
          echo "Production backend deployed successfully"
